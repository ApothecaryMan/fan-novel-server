name = "fan-novel-server"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SYNC_OPEN = "false"
# Mobile-only for now (Expo native has no Origin check). No web domain exists yet.
# When you have a web client, replace "*" with one of these:
# Expo web dev: CORS_ORIGIN = "http://localhost:8081"
# Cloudflare Pages: CORS_ORIGIN = "https://fan-novel.pages.dev"
# Custom: CORS_ORIGIN = "https://app.fan-novel.com,https://api.fan-novel.com"
CORS_ORIGIN = "*"
NODE_ENV = "production"
GOOGLE_WEB_CLIENT_ID = "195474249564-v6tt0n741b80ma3gjne2vtptack749ks.apps.googleusercontent.com"
GOOGLE_ANDROID_CLIENT_ID = "195474249564-2fo5557utpnh2hhoncvg6aj2hf2q51hf.apps.googleusercontent.com"
# Admin bootstrap (first-run seed only): auto-promoted ONLY when zero admins
# exist. After the first admin, manage via DB (/admin UI or
# npm run admin:promote). Demoting works now: seed never re-promotes.
ADMIN_EMAILS = "mohamedrezk.mar@gmail.com"

# In-app update prompt (GET /api/v1/app/version). Edit these + `wrangler deploy`
# to announce a new APK. An empty APP_LATEST_VERSION disables the prompt.
# Each *_NOTES/_FIXES/_CHANGES var is a "|"-separated list of short lines; the
# Arabic ones are also unioned into the legacy flat `notes` field so older
# clients still see the whole release.
APP_LATEST_VERSION = "0.4.3"
APP_MIN_VERSION = ""
APP_UPDATE_URL = "https://fan-novel-server.mohamed1232003.workers.dev/api/v1/app/download"
APP_UPDATE_NOTES = "صفحة اشتراك جديدة داخل التطبيق مع تفعيل Pro|101 إطار بروفايل جديد مصنفة في عائلات|منتقي إطارات افتراضي سريع بعرض عائلي وهندسة مضبوطة|شارات سعر وملكية في خلايا المتجر مع حالة تحميل|إشعارات فصول تسمي الفصل مع روابط عميقة للرواية|تقييد تخصيصات الاستوديو بشارة Pro"
APP_UPDATE_NOTES_EN = "New in-app subscription page with Pro activation|101 new profile frames grouped into families|Fast virtualized family frame picker with tuned per-frame geometry|Price and owned badges in store cells with loading state|Chapter-named release notifications with novel deep links|Studio customs gated behind Pro badge"
APP_UPDATE_FIXES = "رسالة Pro محايدة بدون افتراض التجديد ومطابقة حجم زر القفل|شارات بعرض كامل وخلايا متساوية في الصف الأخير|إصلاح ترتيب الأيقونة في كاروسيل الإطارات للاتجاه الأيسر"
APP_UPDATE_FIXES_EN = "Neutral Pro-only toast without renew assumption and matched lock size|Full-width badges with equal last-row cells|Icon-first badge order fix in LTR frame carousel"
APP_UPDATE_CHANGES = "تحديث واجهات الحساب مع ورقة سفلية متجاوبة مع الكيبورد|تخزين مؤقت لكتالوج المتجر لخمس دقائق|ترحيل تجهيز الزينة إلى PUT مع شارة متجر موحدة"
APP_UPDATE_CHANGES_EN = "Refreshed account surfaces with keyboard-aware bottom sheet|Five-minute store catalog cache|Decoration equip migrated to PUT with shared store badge"
APP_UPDATE_FORCE = "false"
APP_APK_SHA256 = "c9282e0177c7cea94e06c9251b0218714ee6a31fb6f1f92e171b55a442ef750c"

# Required secrets (wrangler secret put):
#   DATABASE_URL  — Neon pooled connection string (https, no Hyperdrive needed; neon-http driver)
#   JWT_SECRET    — long random string
# (A ADMIN_EMAILS secret would override the var above; prefer the var.)
#
# Google OAuth audience check (plain vars, not secrets — must match app.json extra.googleAuth):
#   GOOGLE_WEB_CLIENT_ID
#   GOOGLE_ANDROID_CLIENT_ID
#
# Optional R2 binding for cover uploads (private bucket, served via GET /uploads/covers/*).
[[r2_buckets]]
binding = "COVERS"
bucket_name = "fan-novel-covers"

# Private bucket holding the latest release APK, streamed by
# GET /api/v1/app/download (key: releases/latest.apk).
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "fan-novel-releases"

# Workers rate limiting. The middleware prefers this binding and falls back to
# an in-isolate map when it is absent, so adding it here is what makes the limit
# count across every isolate rather than per instance.
# `simple` needs no configuration; `period` must be 10 or 60 seconds.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
